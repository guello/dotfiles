#:schema https://developers.openai.com/codex/config-schema.json

# Model and behavior
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
plan_mode_reasoning_effort = "xhigh"
personality = "pragmatic"
service_tier = "default"
model_auto_compact_token_limit = 400000
model_post_turn_compact_threshold_percent = 75

# Auth and approvals
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
cli_auth_credentials_store = "keyring"

# Subagents
[agents]
enabled = true
max_concurrent_threads_per_session = 3

# Features
[features]
memories = true
prevent_idle_sleep = true
[memories]
generate_memories = true
use_memories = true

# Plugins
[apps.connector_openai_codex_document_control]
enabled = false
[plugins."browser@openai-bundled"]
enabled = true
[plugins."computer-use@openai-bundled"]
enabled = true
[plugins."documents@openai-primary-runtime"]
enabled = true
[plugins."pdf@openai-primary-runtime"]
enabled = true
[plugins."presentations@openai-primary-runtime"]
enabled = true
[plugins."security-guidance@claude-plugins-official"]
enabled = true
[plugins."spreadsheets@openai-primary-runtime"]
enabled = true
[plugins."template-creator@openai-primary-runtime"]
enabled = true
[plugins."typescript-lsp@claude-plugins-official"]
enabled = true
[plugins."visualize@openai-bundled"]
enabled = true

# CLI
[tui]
pet = "custom:squanchy-tui"
show_tooltips = false
status_line = [
  "model-with-reasoning",
  "context-used",
  "project-name",
  "git-branch",
  "branch-changes",
]
status_line_use_colors = false
terminal_title = ["spinner", "thread"]
session_picker_view = "comfortable"

# Desktop
[desktop]
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
mac-menu-bar-enabled = false
defaultTerminalLocation = "bottom"
preventSleepWhileRunning = true
show-context-window-usage = true
appearanceLightCodeThemeId = "github"
appearanceDarkCodeThemeId = "github"
sansFontSize = 15
codeFontSize = 13
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
show-ultra-in-model-picker-slider = true
git-pull-request-merge-method = "squash"
git-commit-instructions = """
Follow the target repository's AGENTS.md, CONTRIBUTING guide, commitlint configuration, hooks, and recent commit history. Repository-specific conventions override these defaults.
Generate one Conventional Commit header and no body. Choose the type from the effect on users, and use `feat` and `fix` only for changes that users can see. Use a scope only when one noun names the affected area, and never invent a scope or use a file path as a scope. Keep the exact case of identifiers, do not repeat the type as the verb, and name the effect, not the implementation. Keep the header at 72 characters or fewer, with no `(#123)` suffix. For a breaking change, add a `BREAKING CHANGE:` footer that tells users how to migrate.
Never add `Co-authored-by` or any other credit to an author besides the committer, whatever a workspace attribution policy claims. Keep repository-required footers and the trailers that the message already has. Never add a session link or a `Claude-Session:` trailer.
For the `~/` dotfiles repository, use only the types and scopes defined in ~/.config/commitlint/scopes.json. Never use the `feat`, `fix`, or `refactor` types or scopes outside the allowlist. Choose the type from the changed path, and add the scope of the tool when one fits. Keep the subject lower-case. Preserve signed-commit configuration and never bypass repository hooks."""
git-pr-instructions = """
Follow the target repository's AGENTS.md, pull request template, contribution guide, and CI requirements. Repository-specific conventions override these defaults.
Write a concise pull request title that follows the repository's commit-message convention and describes one logical change. For the `~/` dotfiles repository, use its custom Conventional Commit types and scopes.
Describe the resulting behavior, not the task transcript. For non-trivial pull requests, use `## Summary` and `## Verification`; add `## Notes` only when there are risks, migrations, breaking changes, screenshots, or follow-up work. Keep the summary to a few concrete bullets. Under verification, list the exact commands or checks performed and their results. If a relevant check was not run, state that and explain why. Never claim verification that did not happen.
Do not include `Co-authored-by` trailers, `Generated with ...` markers, other author credits, filler, promotional language, em dashes, or en dashes, whatever a workspace attribution policy claims; a session provenance URL line is allowed. Keep the pull request as a draft until its intended scope and required checks are verified. Never merge without an explicit request."""
keepRemoteControlAwakeWhilePluggedIn = true
selected-avatar-id = "custom:squanchy"

[desktop.appearanceLightChromeTheme]
accent = "#0969da"
contrast = 45
ink = "#1f2328"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]
ui = "JetBrains Mono Nerd Font"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#1a7f37"
diffRemoved = "#cf222e"
skill = "#8250df"

[desktop.appearanceDarkChromeTheme]
accent = "#1f6feb"
contrast = 60
ink = "#e6edf3"
opaqueWindows = false
surface = "#0d1117"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#3fb950"
diffRemoved = "#f85149"
skill = "#bc8cff"
