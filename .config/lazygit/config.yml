os:
  editPreset: nvim

gui:
  splitDiff: always
  nerdFontsVersion: 3
  filterMode: fuzzy
  showDivergenceFromBaseBranch: arrowAndNumber
  showNumstatInFilesView: true

git:
  diffRenderers:
    - name: delta
      command: delta --paging=never --width={{width}} {{if gt .width 160}}--side-by-side{{end}}
    - name: delta (side by side)
      command: delta --dark --paging=never --side-by-side --width={{width}}
    - type: rawGit
      name: git
